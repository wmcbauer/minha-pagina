<!-- Dados estruturados: dizem ao Google que isto é uma empresa de serviços,

<body>
<!-- Primeira pintura: aparece na hora, antes de qualquer JavaScript, e é o
     que buscadores e quem está sem JS enxergam. O React troca este bloco pelo
     componente BootScreen (src/components/BootScreen.tsx), que é IDÊNTICO —
     mantenha os dois em sincronia (h1 em português = translations.pt.hero.subtitle). -->
<div id="root"><div class="boot"><div class="boot-inner"><img class="boot-mark" src="/assets/logo-mark.svg" alt="" width="84" height="84"><h1 class="sr-only">Mais clientes e menos trabalho pra você.</h1></div></div></div>
